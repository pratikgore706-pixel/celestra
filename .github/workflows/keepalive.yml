# Keeps the free Render API awake so visitors don't wait ~1 minute for it to start.
# GitHub runs this every 10 minutes (it can be a few minutes late; that is fine).
name: Keep API awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API (and the slowest endpoints, to keep their caches warm)
        run: |
          API=https://celestra-api.onrender.com/api
          for i in 1 2 3; do curl -fsS -m 90 "$API/health" && break || sleep 20; done
          curl -sS -m 60 -o /dev/null "$API/sky/iss?lat=28.6&lon=77.2" || true
          curl -sS -m 60 -o /dev/null "$API/sky/launches" || true
